name: Seed production

# Manual only. Runs the idempotent server seed on the EC2 box:
#  - pins the built-in roles (super_admin/admin/gis_analyst/viewer) to the
#    National access level so hierarchical scoping never locks them out,
#  - backfills access-level slug/rank,
#  - (optional) creates the scope.<tier>@rtb.gov.rw demo logins.
on:
  workflow_dispatch:
    inputs:
      scoped_test_users:
        description: "Also seed scope.<tier>@rtb.gov.rw demo users (password Scope@123)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  seed:
    name: SSH seed on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Run seed over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            echo "Seeding at $(git rev-parse --short HEAD)"
            set -a
            source /var/lib/rtb/env/server.env
            set +a
            export SEED_SCOPED_TEST_USERS="${{ inputs.scoped_test_users }}"
            npm --prefix server run seed:prod
            echo "Seed complete (scoped_test_users=${{ inputs.scoped_test_users }})"
