name: Deploy to EC2

# Runs only after the CI workflow succeeds on `main` (i.e. after a merge).
# Manual re-deploys via the "Run workflow" button.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    # For workflow_run: only proceed when CI actually passed.
    # For workflow_dispatch: event name check short-circuits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            bash deploy/scripts/deploy.sh

      - name: Public smoke test
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" https://rtb.aerovyntech.com/api/v1/health || echo 000)
          echo "https://rtb.aerovyntech.com/api/v1/health -> $code"
          test "$code" = "200"
