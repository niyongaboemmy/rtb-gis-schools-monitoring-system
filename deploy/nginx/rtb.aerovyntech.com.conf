# /etc/nginx/sites-available/rtb.aerovyntech.com.conf
# Certbot rewrites this to add the :443 server + TLS lines on first run
# (`sudo certbot --nginx -d rtb.aerovyntech.com`). Keep the :80 block minimal.

server {
    listen 80;
    listen [::]:80;
    server_name rtb.aerovyntech.com;

    # Static React build
    root /var/www/rtb-client;
    index index.html;

    # Allow arbitrarily large KMZ/KML uploads (multi-GB).
    client_max_body_size 0;
    client_body_timeout 3600s;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- NestJS API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # ---- WebSockets (socket.io) ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---- Legacy static asset paths served by the API ----
    location /uploads/ { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }
    location /public/  { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }

    # ---- Dedicated file-server (heavy spatial assets) ----
    location ~ ^/(files|upload)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_request_buffering off;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
